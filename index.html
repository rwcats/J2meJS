<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>j2me online emulator</title>
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
		<script src="httpss://cdn.tailwindcss.com"></script>
		<script src="libs/encoding.js"></script>
		<script type="text/javascript" src="config/default.js" defer></script>
		<script type="text/javascript" src="config/runtests.js" defer></script>
		<script type="text/javascript" src="config/build.js" defer></script>
		<script type="text/javascript" src="config/urlparams.js" defer></script>
		<script type="text/javascript" src="libs/promise-6.0.0.js" defer></script>
		<script type="text/javascript" src="polyfill/IndexedDB-getAll-shim.js" defer></script>
		<script type="text/javascript" src="libs/compiled-method-cache.js" defer></script>
		<script type="text/javascript" src="bld/native.js" defer></script>
		<script type="text/javascript" src="bld/j2me.js" defer></script>
		<script type="text/javascript" src="bld/main-all.js" defer></script>
	</head>
	<body class="bg-gray-900 text-white flex flex-col items-center">

		<input id="jarFileupload" accept=".jar" type="file" class="hidden" />
		<h3 class="text-2xl font-bold my-4">Game List:</h3>
		<div id="gameListDiv" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 p-4">
			<script type="text/javascript">
				var GameList = [{
						name: "Anyview",
						jarName: "Anyview4.0.jar",
						midletClassName: "com.ismyway.anyview.Anyview",
						picPath: "img/anyview.png"
					},
					{
						name: "狂野飙车6",
						jarName: "kybc6.jar",
						midletClassName: "GloftASP6",
						picPath: "img/kybc6.png"
					},
					{
						name: "植物大战僵尸",
						jarName: "pvz.jar",
						midletClassName: "Game",
						picPath: "img/pvz.png"
					},
					{
						name: "刺客信条3",
						jarName: "ckxt3.jar",
						midletClassName: "GloftASBR",
						picPath: "img/ckxt3.png"
					},
					{
						name: "开心农场",
						jarName: "kxnc.jar",
						midletClassName: "FarmMIDlet",
						picPath: "img/kxnc.png"
					},
					{
						name: "RF18",
						jarName: "rf18.jar",
						midletClassName: "GloftR8FP",
						picPath: "img/rf18.png"
					},
					{
						name: "BounceTales",
						jarName: "BounceTales.jar",
						midletClassName: "RMIDlet",
						picPath: "img/BounceTales.png"
					},
					{
						name: "极限拉力赛2",
						jarName: "jxlls.jar",
						midletClassName: "baltorogames.system.Application",
						picPath: "img/jxlls.png"
					},
					{
						name: "斗地主",
						jarName: "ddz.jar",
						midletClassName: "GameMidlet",
						picPath: "img/ddz.png"
					},
					{
						name: "GTA5",
						jarName: "gta.jar",
						midletClassName: "SaintsRow2",
						picPath: "img/gta.png"
					},
					{
						name: "涂鸦跳跃",
						jarName: "tyty.jar",
						midletClassName: "S",
						picPath: "img/tyty.png"
					},{
						name: "中国象棋",
						jarName: "chess.jar",
						midletClassName: "com.chess.Tmpmidlet",
						picPath: "img/chess.png"
					},
					{
						name: "模拟人生3",
						jarName: "sim3.jar",
						midletClassName: "com.ea.sims3.MonkeyApp",
						picPath: "img/sim3.png"
					},
					{
						name: "韩版开心农场",
						jarName: "kxnckr.jar",
						midletClassName: "com.auer.title.GameMidlet",
						picPath: "img/kxnckr.png"
					},
					{
						name: "侏罗纪公园-巨兽归来",
						jarName: "dragon.jar",
						midletClassName: "GloftJUPK",
						picPath: "img/dragon.png"
					},
					{
						name: "鳄鱼小顽皮爱洗澡",
						jarName: "WheresMyWater.jar",
						picPath: "img/WheresMyWater.png",
						midletClassName: "xor.wimw.j2me.src.WIMWGameController"
					}
				]
				// Init GameList
				var GameListHtml = '';
				for (var i = 0; i < GameList.length; i++) {
					var gameName = GameList[i]['name'];
					var jarName = GameList[i]['jarName'];
					var midletClassName = GameList[i]['midletClassName'];
					var picPath = GameList[i]['picPath'];
					var onClickFunc = "openJar('"+jarName+"','"+midletClassName+"');";
					GameListHtml += '<a class="game bg-gray-800 rounded-lg p-4 flex flex-col items-center justify-center hover:bg-gray-700 transition" href="javascript:void(0)" onclick="'+onClickFunc+'">' +
						'<div>' +
						'<img src="' + picPath + '" width="64px" height="64px" class="rounded-md"></img>' +
						'</div>' +
						'<span class="text-sm mt-2">' + gameName + '</span>' +
						'</a>';
				}
				document.getElementById('gameListDiv').innerHTML = GameListHtml;

				function refreshGameList() {
					JARStore.getAll().then(
						(files) => {
							var localjars = document.getElementById('localjars');
							localjars.length = 0;
							for (var i = 0; i < files.length; i++) {
								var f = files[i];
								localjars.options.add(new Option(f.jarName));
							}
							var gameindex = config01.getValueByKey("gameindex");
							var localjars = document.getElementById('localjars');
							if (gameindex >= files.length) {
								gameindex = files.length - 1;
							}
							localjars.selectedIndex = gameindex;
						},
						(err) => {
							alert(err);
						}
					);
				}

				function loadLocalJar() {
					
					var localjars = document.getElementById('localjars');
					if (localjars.options.length == 0) {
						alert("Please upload a jar file first!");
						return;
					}
					if (localjars.selectedIndex < 0 || localjars.selectedIndex >= localjars.options.length) {
						alert("Please select a jar name!");
						return;
					}
					var jarname = localjars.options[localjars.selectedIndex].text;
					console.log(jarname);
					openJar(jarname, "", 1);

				}

				function deleteLocalJar() {

					var localjars = document.getElementById('localjars');
					if (localjars.options.length == 0) {
						alert("No jar to delete!");
						return;
					}
					if (localjars.selectedIndex < 0 || localjars.selectedIndex >= localjars.options.length) {
						alert("Please select a jar name!");
						return;
					}
					var jarname = localjars.options[localjars.selectedIndex].text;
					console.log(jarname);
					let res = confirm('Are you sure to delete ' + jarname + ' ?');
					if (res) {
						JARStore.deleteJar(jarname).then(
							() => {
								alert(jarname + " deleted successfully！");
								refreshGameList();
							},
							(errname) => {
								alert(errname + " delete failed！");
							}
						);
					}
				}
				var onUploadFile = function(e) {
					const _files = e.target.files;
					if (_files.length == 0) {
						return;
					}
					const _file = _files[0];
					if (!_file.name.toLowerCase().endsWith('.jar')) {
						alert("Only jar format is allowed!");
						return;
					}
					const reader = new FileReader();
					reader.readAsArrayBuffer(_file);
					reader.onload = function(readRes) {
						JARStore.installJAR(_file.name, readRes.target.result).then(
							() => {
								alert(_file.name + " installed successfully！");
								refreshGameList();
							},
							(errname) => {
								alert(errname + " install failed！");
							}
						);
						document.getElementById("jarFileupload").value = null;
					}
				}

				var config = function() {
					var myInfo = {
						canvasSize: 4,
						gamepadSize: 0,
						gameresize: 0,
						gameindex: 0,
					};
					if (window.localStorage["my"] === undefined) {
						window.localStorage["my"] = JSON.stringify(myInfo);
					} else {
						var data = JSON.parse(window.localStorage["my"]);
						for (var key in data) {
							myInfo[key] = data[key];
						}
					}
					return {
						getValueByKey(key) {
							return myInfo[key]
						},
						setValueByKey() {
							for (var i = 0; i < arguments.length; i += 2) {
								myInfo[arguments[i]] = arguments[i + 1];
							}
							window.localStorage["my"] = JSON.stringify(myInfo);
						}
					}
				}

				var config01 = new config();
				window.addEventListener("load", () => {
					var csize = config01.getValueByKey("canvasSize");
					var gsize = config01.getValueByKey("gamepadSize");
					var gresize = config01.getValueByKey("gameresize");

					var gamepadSize = document.getElementById('gamepadSize');
					var canvasSize = document.getElementById('canvasSize');
					var gameresize = document.getElementById('gameresize');

					canvasSize.selectedIndex = csize;
					gamepadSize.selectedIndex = gsize;
					gameresize.selectedIndex = gresize;

					document.getElementById("jarFileupload").addEventListener("change", onUploadFile);
					refreshGameList();
				})

				function openLocalJar() {
					document.getElementById("jarFileupload").click();
				}

				function openJar(jarname, midletClassName, islocaljar) {
					var href = 'main.html?jars=jar/' + jarname + '&jad=&midletClassName=' + midletClassName;
					if (islocaljar) {
						href = 'main.html?localjar=' + jarname;
					}

					var gamepadSize = document.getElementById('gamepadSize');
					var mvalue = gamepadSize.options[gamepadSize.selectedIndex].value;
					if (mvalue) {
						href += "&gamepadSize=" + mvalue;
						if (gamepadSize.selectedIndex == 0) {
							href += "&gamepad=0";
						} else {
							href += "&gamepad=1";
						}
					}

					var canvasSize = document.getElementById('canvasSize');
					var mvalue = canvasSize.options[canvasSize.selectedIndex].value;
					if (mvalue) {
						href += "&canvasSize=" + mvalue;
					}
					var gameresize = document.getElementById('gameresize');
					var gameresizevalue = gameresize.options[gameresize.selectedIndex].value;
					if (gameresizevalue) {
						href += "&gameresize=" + gameresizevalue;
					}

					var localjars = document.getElementById('localjars');

					config01.setValueByKey("canvasSize", canvasSize.selectedIndex);
					config01.setValueByKey("gamepadSize", gamepadSize.selectedIndex);
					config01.setValueByKey("gameresize", gameresize.selectedIndex);
					config01.setValueByKey("gameindex", localjars.selectedIndex)

					window.location.href = href;
				}
			</script>
		</div>

		<div class="mt-8 space-y-4">
			<select id="canvasSize" class="bg-gray-800 text-white rounded-lg p-2">
				<option value="size-240x320">Display Size: 240x320</option>
				<option value="size-320x240">Display Size: 320x240</option>
				<option value="size-360x640">Display Size: 360x640</option>
				<option value="size-640x360">Display Size: 640x360</option>
				<option value="size-no" selected>Display Size: Unrestricted</option>
			</select>
			<select id="gamepadSize" class="bg-gray-800 text-white rounded-lg p-2">
				<option value="gamepad-0" selected>Virtual Keyboard - None</option>
				<option value="gamepad-1">Virtual Keyboard - Small</option>
				<option value="gamepad-2">Virtual Keyboard - Medium</option>
				<option value="gamepad-3">Virtual Keyboard - Large</option>
				<option value="gamepad-4">Virtual Keyboard - Extra Large</option>
			</select>
			<select id="gameresize" class="bg-gray-800 text-white rounded-lg p-2">
				<option value="resize-1" selected>No Scaling</option>
				<option value="resize-1x5">Scale 1.5x</option>
				<option value="resize-2">Scale 2x</option>
				<option value="resize-2x5">Scale 2.5x</option>
				<option value="resize-3">Scale 3x</option>
			</select>
			<div class="flex space-x-4">
				<select id="localjars" class="bg-gray-800 text-white rounded-lg p-2 flex-grow">
					<option value="" selected>No items</option>
				</select>
				<button class="bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-blue-600 transition" onclick="openLocalJar()">
					Select local jar
				</button>
				<button class="bg-green-500 text-white py-2 px-4 rounded-lg hover:bg-green-600 transition" onclick="loadLocalJar()">
					Run local jar
				</button>
				<button class="bg-red-500 text-white py-2 px-4 rounded-lg hover:bg-red-600 transition" onclick="deleteLocalJar()">
					Delete local jar
				</button>
			</div>
			<div class="flex justify-end space-x-4 mt-4">
				<a href="indexbatch.html" class="text-blue-400 hover:underline">
					Batch install version
				</a>
				<a href="updatelog.html" class="text-blue-400 hover:underline">
					Update Log
				</a>
			</div>
		</div>

	</body>
</html>
