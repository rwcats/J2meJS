<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>

	<script src="./libs/PicoAudio.js" type="text/javascript"></script> 
	<script src="./libs/webaudio.js" type="text/javascript"></script> 
	<script src="./libs/webaudio-tinysynth.js" type="text/javascript"></script> 
	<script src="./libs/BenzAMRRecorder.js" type="text/javascript"></script> 
  <script src="libs/encoding.js"></script>
  <script type="text/javascript" src="config/default.js" defer></script>
  <script type="text/javascript" src="config/runtests.js" defer></script>
  <script type="text/javascript" src="config/build.js" defer></script>
  <script type="text/javascript" src="config/urlparams.js" defer></script>
  <script type="text/javascript" src="libs/promise-6.0.0.js" defer></script>
  <script type="text/javascript" src="polyfill/IndexedDB-getAll-shim.js" defer></script>
  <script type="text/javascript" src="libs/compiled-method-cache.js" defer></script>
  <script type="text/javascript" src="bld/native.js" defer></script>
  <script type="text/javascript" src="bld/j2me.js" defer></script>
  <script type="text/javascript" src="bld/main-all.js" defer></script>
  <script type="text/javascript" src="keymap.js"></script>
  <style type="text/tailwindcss">
    .key {
      @apply bg-gray-700 p-2 rounded-md h-12 flex flex-col justify-center items-center transition hover:bg-gray-600;
    }
  </style>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen">

  <div class="w-[360px] h-[780px] bg-[#2d3748] rounded-[40px] p-4 flex flex-col shadow-2xl border-2 border-gray-700">
    <!-- Screen -->
    <div id="display-container" class="bg-black w-full h-[45%] rounded-lg flex items-center justify-center text-white text-center">
        <div id="display" class="relative w-full h-full">
            <div id="main" role="main" class="w-full h-full bg-gray-900 flex items-center justify-center">
                <canvas id="canvas" class="w-full h-full"></canvas>
            </div>
            <div id="download-screen" class="screen absolute inset-0 bg-gray-800 text-white flex flex-col items-center justify-center" style="display: none;">
                <h1 class="title text-lg mb-2">Downloading midlet…</h1>
                <div class="download-progress-container w-3/4">
                    <progress class="pack-activity w-full" id="download-bar" value="0" max="100"></progress>
                </div>
            </div>
             <div id="splash-screen" class="screen absolute inset-0 bg-gray-800 text-white flex flex-col items-center justify-center" style="display: none;">
                <h1 class="title text-lg mb-2">Starting midlet…</h1>
                <div class="splash-progress-container">
                    <progress></progress>
                </div>
            </div>
             <div id="exit-screen" class="screen" style="display: none;"></div>
             <div id="background-screen" style="display: none;"></div>
        </div>
    </div>

    <!-- Controls -->
    <div class="flex-grow flex flex-col justify-between mt-4 text-white">
      <div id="gamepad" onselectstart='return false' οnselect='document.selection.empty()'>
        <div class="flex justify-between px-2">
          <div class="pad-content"><button class="w-16 h-8 bg-gray-700 rounded-md text-sm transition hover:bg-gray-600">L</button></div>
          <div class="pad-content"><button class="w-16 h-8 bg-green-500 rounded-md text-sm transition hover:bg-green-600">Call</button></div>
          <div class="pad-content"><button class="w-16 h-8 bg-red-500 rounded-md text-sm transition hover:bg-red-600">Cancel</button></div>
          <div class="pad-content"><button class="w-16 h-8 bg-gray-700 rounded-md text-sm transition hover:bg-gray-600">R</button></div>
        </div>
        <div class="relative flex items-center justify-center my-2">
          <div class="grid grid-cols-3 grid-rows-3 w-32 h-32">
            <div class="pad-content col-start-2 row-start-1 flex justify-center items-center"><button class="w-10 h-10 bg-gray-700 rounded-md transition hover:bg-gray-600">up</button></div>
            <div class="pad-content col-start-1 row-start-2 flex justify-center items-center"><button class="w-10 h-10 bg-gray-700 rounded-md transition hover:bg-gray-600">left</button></div>
            <div class="pad-content col-start-2 row-start-2 flex justify-center items-center"><button class="w-10 h-10 bg-gray-600 rounded-md transition hover:bg-gray-500">OK</button></div>
            <div class="pad-content col-start-3 row-start-2 flex justify-center items-center"><button class="w-10 h-10 bg-gray-700 rounded-md transition hover:bg-gray-600">right</button></div>
            <div class="pad-content col-start-2 row-start-3 flex justify-center items-center"><button class="w-10 h-10 bg-gray-700 rounded-md transition hover:bg-gray-600">down</button></div>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-3 text-center">
          <div class="pad-content"><button class="key">1</button></div>
          <div class="pad-content"><button class="key">2 <span class="text-xs block opacity-70">ABC</span></button></div>
          <div class="pad-content"><button class="key">3 <span class="text-xs block opacity-70">DEF</span></button></div>
          <div class="pad-content"><button class="key">4 <span class="text-xs block opacity-70">GHI</span></button></div>
          <div class="pad-content"><button class="key">5 <span class="text-xs block opacity-70">JKL</span></button></div>
          <div class="pad-content"><button class="key">6 <span class="text-xs block opacity-70">MNO</span></button></div>
          <div class="pad-content"><button class="key">7 <span class="text-xs block opacity-70">PQRS</span></button></div>
          <div class="pad-content"><button class="key">8 <span class="text-xs block opacity-70">TUV</span></button></div>
          <div class="pad-content"><button class="key">9 <span class="text-xs block opacity-70">WXYZ</span></button></div>
          <div class="pad-content"><button class="key">*</button></div>
          <div class="pad-content"><button class="key">0 <span class="text-xs block opacity-70">+</span></button></div>
          <div class="pad-content"><button class="key">#</button></div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: none;">
      <input id="File" type="file" />
      <div id="pageContainer"><pre id="consoleContainer"></pre></div>
      <pre id="raw-console"></pre>
      <section id="sidebar" data-type="sidebar"></section>
      <section id="drawer" role="region">
          <input id="password-editor" class="text-editor" type="password">
          <input id="tel-editor" class="text-editor" type="tel">
          <input id="number-editor" class="text-editor" type="number">
          <input id="email-editor" class="text-editor" type="email">
          <input id="url-editor" class="text-editor" type="url">
          <div id="textarea-editor" class="text-editor" contenteditable="true"></div>
          <div id="hidden-textarea-editor" class="text-editor"></div>
      </section>
      <form role="dialog" data-type="confirm" class="lcdui-alert" id="lcdui-alert">
        <section><h1 class="title"></h1><p class="text"></p></section>
        <menu><button class="button0"></button><button class="button1"></button></menu>
      </form>
      <form role="dialog" data-type="confirm" class="sms-listener-prompt" id="sms-listener-prompt"><section></section><menu></menu></form>
      <form role="dialog" data-type="confirm" class="nokia-fileui-prompt" id="nokia-fileui-prompt"><section></section><menu></menu></form>
      <form role="dialog" data-type="confirm" class="download-failure-dialog" id="download-failure-dialog"><section></section><menu></menu></form>
      <div id="settings"></div>
  </div>
</body>
</html>
